[mypy]
python_version = 3.11
warn_unused_configs = True
# FreeCAD resolves its workbench code as top-level modules on sys.path
# (there are no __init__.py files in a FreeCAD workbench).
explicit_package_bases = True
show_error_codes = True
pretty = True

# pivy (Coin3D bindings) ships inside the FreeCAD installation and has no
# stubs on PyPI; it is only imported inside view-provider attach() methods.
[mypy-pivy]
ignore_missing_imports = True

[mypy-pivy.*]
ignore_missing_imports = True
